name: fetch-apostle-images
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/fetch-images.mjs
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add img tools/report.json tools/names.found.json
          if ! git diff --cached --quiet; then git commit -m "fetch apostle images" && git push; fi
